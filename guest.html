<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101822" />
    <meta name="description" content="Cube Chess 512 AI — anonymous guest entry for ForgeMCP reviewer demo." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/cube-chess.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/cube-chess.svg" />
    <title>Cube Chess 512 AI — Guest</title>
    <script>document.documentElement.dataset.directGuest = 'true';</script>
    <style>
      .forgemcp-project-tab{position:fixed;right:14px;bottom:14px;z-index:10000;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid rgba(120,190,255,.55);border-radius:999px;background:rgba(8,16,28,.92);color:#e7f4ff;text-decoration:none;font:700 13px/1.2 Inter,system-ui,-apple-system,Segoe UI,sans-serif;box-shadow:0 10px 28px rgba(0,0,0,.35);backdrop-filter:blur(12px)}
      .forgemcp-project-tab:hover,.forgemcp-project-tab:focus-visible{border-color:#89c9ff;background:#10263d;outline:none}.forgemcp-project-tab span{color:#89c9ff;font-size:10px;letter-spacing:.08em}@media(max-width:640px){.forgemcp-project-tab{right:10px;bottom:74px;padding:9px 12px;font-size:12px}}
      html[data-direct-guest="true"] .auth-gate:not(.auth-gate-hidden){visibility:hidden!important;pointer-events:none!important}
      #forgemcp-guest-loading{position:fixed;inset:0;z-index:9998;display:grid;place-items:center;background:#07111d;color:#e9f7ff;font:700 16px/1.4 Inter,system-ui,sans-serif;letter-spacing:.03em}
      html[data-direct-guest-ready="true"] #forgemcp-guest-loading{display:none}
    </style>
  </head>
  <body>
    <main id="app" aria-label="Cube Chess 512 visualizer"></main>
    <div id="forgemcp-guest-loading" role="status">Loading Cube Chess 512…</div>
    <a class="forgemcp-project-tab" href="./forgemcp/" aria-label="Open ForgeMCP Multi-Agent Research and Game Studio project page"><span>WEBMCP</span> ForgeMCP</a>
    <script>
      (() => {
        const updateReadyState = () => {
          const app = document.querySelector('#app');
          if (app?.dataset?.authMode !== 'guest') return;
          document.documentElement.dataset.directGuestActivated = 'true';
          document.documentElement.dataset.directGuestReady = 'true';
        };
        const observer = new MutationObserver(updateReadyState);
        observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
        window.addEventListener('load', updateReadyState, { once: true });
        updateReadyState();
      })();
    </script>
    <script type="module" src="/web/promotion/bootstrap.js"></script>
  </body>
</html>
