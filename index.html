<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101822" />
    <meta name="description" content="Open-source 3D chess on one 8×8×8 board with 512 fields." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/cube-chess.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/cube-chess.svg" />
    <title>Cube Chess 512 AI</title>
    <script src="./english-judge-default.js"></script>
    <style>
      .forgemcp-project-tab{position:fixed;right:14px;bottom:14px;z-index:10000;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid rgba(120,190,255,.55);border-radius:999px;background:rgba(8,16,28,.92);color:#e7f4ff;text-decoration:none;font:700 13px/1.2 Inter,system-ui,-apple-system,Segoe UI,sans-serif;box-shadow:0 10px 28px rgba(0,0,0,.35);backdrop-filter:blur(12px)}
      .forgemcp-project-tab:hover,.forgemcp-project-tab:focus-visible{border-color:#89c9ff;background:#10263d;outline:none}.forgemcp-project-tab span{color:#89c9ff;font-size:10px;letter-spacing:.08em}@media(max-width:640px){.forgemcp-project-tab{right:10px;bottom:74px;padding:9px 12px;font-size:12px}}
    </style>
  </head>
  <body>
    <main id="app" aria-label="Cube Chess 512 visualizer"></main>
    <a class="forgemcp-project-tab" href="./forgemcp/" aria-label="Open ForgeMCP Multi-Agent Research and Game Studio project page"><span>WEBMCP</span> ForgeMCP</a>
    <script>
      // Explicit ForgeMCP reviewer entry. For ?guest=1 we activate the exact
      // existing "Play as guest" control as soon as AuthGate creates it.
      // This does not create or impersonate an account and grants no account,
      // ranking or multiplayer privileges.
      (() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('guest') !== '1') return;
        document.documentElement.dataset.directGuest = 'true';

        const activateExistingGuestButton = () => {
          const button = document.querySelector('.auth-guest[data-auth="guest"]');
          if (!button) return false;
          button.click();
          document.documentElement.dataset.directGuestActivated = 'true';
          return true;
        };

        const observer = new MutationObserver(() => {
          if (!activateExistingGuestButton()) return;
          observer.disconnect();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        queueMicrotask(() => {
          if (!activateExistingGuestButton()) return;
          observer.disconnect();
        });
      })();
    </script>
    <script type="module" src="/web/promotion/bootstrap.js"></script>
  </body>
</html>
