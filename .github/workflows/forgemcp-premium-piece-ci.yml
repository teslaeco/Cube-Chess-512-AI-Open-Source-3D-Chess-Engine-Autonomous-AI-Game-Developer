name: ForgeMCP Premium Piece CI

on:
  pull_request:
    paths:
      - "web/renderer/**"
      - "web/forgemcp/**"
      - "web/promotion/**"
      - "docs/FORGEMCP_PREMIUM_PIECES.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/forgemcp-premium-piece-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dist smoke test
        run: npm run smoke:dist
