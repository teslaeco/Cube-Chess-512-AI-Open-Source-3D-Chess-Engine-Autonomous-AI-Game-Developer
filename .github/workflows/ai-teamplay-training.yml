name: Train Cube Chess Real Team Play 3K

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/ai/**"
      - "web/state/initialPosition.js"
      - "scripts/train-real-team-selfplay.mjs"
      - "scripts/merge-real-team-selfplay.mjs"
      - "package.json"
      - ".github/workflows/ai-teamplay-training.yml"
  workflow_dispatch:
    inputs:
      games_per_policy:
        description: Real legal self-play games per policy
        required: false
        default: "1000"
      plies:
        description: Maximum hard-AI plies per game
        required: false
        default: "18"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ai-real-teamplay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run material and team-play regressions
        run: >-
          npx vitest run
          web/ai/teamPlayPolicy.test.js
          web/ai/aiSelfPlaySmoke.test.js
          web/ai/finalMoveSafety.test.js
          web/ai/queenTradeRegression.test.js

  train-policy:
    needs: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        policy:
          - balanced-v6
          - squad-attack-v7
          - queen-discipline-v7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run 1000 real legal games for ${{ matrix.policy }}
        env:
          GAMES_PER_POLICY: ${{ github.event.inputs.games_per_policy || '1000' }}
          TRAINING_PLIES: ${{ github.event.inputs.plies || '18' }}
          POLICY: ${{ matrix.policy }}
        run: >-
          npm run train:real-teamplay --
          --policy="$POLICY"
          --games-per-policy="$GAMES_PER_POLICY"
          --plies="$TRAINING_PLIES"
          --report="artifacts/real-teamplay-$POLICY.json"

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-teamplay-shard-${{ matrix.policy }}-${{ github.run_id }}
          path: artifacts/real-teamplay-${{ matrix.policy }}.json
          if-no-files-found: error

  aggregate:
    needs: train-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download all policy reports
        uses: actions/download-artifact@v4
        with:
          pattern: real-teamplay-shard-*-${{ github.run_id }}
          path: artifacts/real-teamplay-shards
          merge-multiple: true

      - name: Aggregate and enforce the 3000-game gate
        run: >-
          npm run train:real-teamplay:merge --
          --input=artifacts/real-teamplay-shards
          --report=artifacts/real-team-selfplay-3000-report.json

      - name: Upload final 3000-game report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-teamplay-training-${{ github.run_id }}
          path: artifacts/real-team-selfplay-3000-report.json
          if-no-files-found: error
