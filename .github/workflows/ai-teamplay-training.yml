name: Train Cube Chess Real Team Play 3K

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/ai/**"
      - "web/state/initialPosition.js"
      - "scripts/train-real-team-selfplay.mjs"
      - "package.json"
      - ".github/workflows/ai-teamplay-training.yml"
  workflow_dispatch:
    inputs:
      games_per_policy:
        description: Real legal self-play games per policy
        required: false
        default: "1000"
      plies:
        description: Maximum hard-AI plies per game
        required: false
        default: "18"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ai-real-teamplay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  train-real-team-play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run material and team-play regressions
        run: >-
          npx vitest run
          web/ai/teamPlayPolicy.test.js
          web/ai/aiSelfPlaySmoke.test.js
          web/ai/finalMoveSafety.test.js

      - name: Run 3000 real legal hard-AI games
        env:
          GAMES_PER_POLICY: ${{ github.event.inputs.games_per_policy || '1000' }}
          TRAINING_PLIES: ${{ github.event.inputs.plies || '18' }}
        run: >-
          npm run train:real-teamplay --
          --games-per-policy="$GAMES_PER_POLICY"
          --plies="$TRAINING_PLIES"
          --report=artifacts/real-team-selfplay-3000-report.json

      - name: Upload real self-play report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-teamplay-training-${{ github.run_id }}
          path: artifacts/real-team-selfplay-3000-report.json
          if-no-files-found: warn
