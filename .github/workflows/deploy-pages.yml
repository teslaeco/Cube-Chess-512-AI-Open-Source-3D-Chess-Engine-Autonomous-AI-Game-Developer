name: Deploy Cube Chess 512 to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      MOZ_WEBRENDER: "1"
      MOZ_DISABLE_HW_ACCELERATION: "1"
      PW_FIREFOX_XVFB: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for pull-request checks
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Install all browser engines for main
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run required desktop and mobile interaction tests
        if: github.event_name == 'pull_request'
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset"
          npm run test:e2e --
          --project=chromium-desktop
          --project=mobile-chrome

      - name: Run full cross-browser interaction suite
        if: github.event_name != 'pull_request'
        run: >-
          xvfb-run --auto-servernum
          --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset"
          npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build production site
        run: npm run build

      - name: Smoke-test production artifact
        run: npm run smoke:dist

      - name: Verify Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - e2e
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
